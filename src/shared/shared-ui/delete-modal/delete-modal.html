<app-modal-base
  [modalType]="type()"
  [modalTitle]="title()"
  (closeOutput)="closeCurrentModal()"
  (deleteOutput)="onDelete()"
>
  <div class="text-align-center">
    <h3>{{ 'MODALS.delete.title' | translateFallback: 'Uwaga!'}}</h3>
    <p>{{ 'MODALS.delete.text' | translateFallback: 'Czy na pewno chcesz usunąc tę pozycję?'}}</p>
  </div>
</app-modal-base>
