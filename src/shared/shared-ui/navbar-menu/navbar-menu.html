<div class="d-flex flex-column navbar-menu text-align-center">
  <h3>RFQ ASSISTANT</h3>
  <div class="upper-section d-flex flex-column align-items-center">
    @for (item of applicationList(); track item.id) {
    <button type="button" class="navbar-item mt-4" (click)="onNavBarItemClick(item.route)">
      <p>{{item.name | translateFallback: item.nameFallback}}</p>
    </button>
    }
  </div>
  <div class="lower-section">
    <button type="button" (click)="logOut()">Wyloguj się</button>
  </div>
</div>
