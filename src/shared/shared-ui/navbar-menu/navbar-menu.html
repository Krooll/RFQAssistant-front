<div class="d-flex flex-column navbar-menu text-align-center">
  <div class="mt-4">
    <h3>{{ 'APP.title' | translateFallback: 'RFQ Assistant' }}</h3>
  </div>
  <div class="upper-section d-flex flex-column p-1">
    @for (item of applicationList(); track item.id) {
    <app-button
      [buttonType]="ButtonTypes.button"
      [buttonConfiguration]="menuNavBarButtonConfig"
      [dataToEmit]="item.route"
      (emitButtonClick)="onNavBarItemClick($event)"
    >
      <p>{{ item.name | translateFallback: item.nameFallback }}</p>
    </app-button>
    }
  </div>
  <div class="d-flex align-items-end p-1">
    <div class="d-flex flex-column w-100">
      <app-button
        [buttonType]="ButtonTypes.button"
        (emitButtonClick)="onLangChangeButtonClick()"
        [buttonConfiguration]="menuNavBarButtonConfig"
      >
        {{ 'BUTTONS.lang' | translateFallback: 'Język' }}
      </app-button>
      <app-button
        [buttonType]="ButtonTypes.button"
        [buttonConfiguration]="menuNavBarButtonConfig"
        (emitButtonClick)="logOut()"
      >
        {{ 'BUTTONS.logout' | translateFallback: 'Wyloguj się' }}
      </app-button>
    </div>
  </div>
</div>
