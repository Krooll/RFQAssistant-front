<div class="d-flex flex-column component-container">
  <div class="d-flex align-items-center justify-content-between p-1">
    <h2>{{ 'USER_COMPONENT.componentTitle' | translateFallback: 'Użytkownicy' }}</h2>
    <app-button [buttonType]="ButtonTypes.button" (emitButtonClick)="onAddButtonClicked()">
      {{ 'BUTTONS.add' | translateFallback: 'Dodaj' }}
    </app-button>
  </div>
  <div class="list-container">
    <app-table
      (deleteClick)="onDeleteButtonCLicked($event)"
      (infoClick)="onInfoButtonClicked($event)"
      (pageChange)="_userComponentService.updatePageParams($event)"
      [dataSource]="_userComponentService.userList()"
      [pageParams]="_userComponentService.pageParams()"
      [totalElements]="_userComponentService.totalElements()"
    ></app-table>
  </div>
</div>
