<div class="d-flex flex-column component-container">
  <div class="d-flex align-items-center justify-content-between p-1">
    <h2>{{ 'PROJECT_COMPONENT.componentTitle' | translateFallback: 'Projekty' }}</h2>
    <app-button [buttonType]="ButtonTypes.button" (emitButtonClick)="onAddButtonClicked()">
      <p>{{ 'BUTTONS.add' | translateFallback: 'Dodaj' }}</p>
    </app-button>
  </div>
  <div class="list-container">
    <app-table
      (deleteClick)="onDeleteButtonCLicked($event)"
      (infoClick)="onInfoButtonClicked($event)"
      (pageChange)="_projectComponentService.updatePageParams($event)"
      [dataSource]="_projectComponentService.projectList()"
      [pageParams]="_projectComponentService.pageParams()"
      [totalElements]="_projectComponentService.totalElements()"
    ></app-table>
  </div>
</div>
