<div class="d-flex flex-column component-container">
  <div class="d-flex align-items-center justify-content-between p-1">
    <h2>{{ 'MATERIAL_COMPONENT.componentTitle' | translateFallback: 'Materiały' }}</h2>
    <app-button [buttonType]="ButtonTypes.button" (emitButtonClick)="onAddButtonClicked()">
      {{ 'BUTTONS.add' | translateFallback: 'Dodaj' }}
    </app-button>
  </div>
  <div class="list-container">
    <app-table
      (deleteClick)="onDeleteButtonCLicked($event)"
      (infoClick)="onInfoButtonClicked($event)"
      (pageChange)="_materialComponentService.updatePageParams($event)"
      [dataSource]="_materialComponentService.materialList()"
      [pageParams]="_materialComponentService.pageParams()"
      [totalElements]="_materialComponentService.totalElements()"
    ></app-table>
  </div>
</div>
