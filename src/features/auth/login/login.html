<div class="d-flex align-items-center justify-content-center body-container">
  <form [formGroup]="formGroup()!" (ngSubmit)="onSubmit()">
    <div class="d-flex flex-column mt-4">
      @let login = 'login';
      <label [for]="login">
        {{ 'LOGIN_COMPONENT.form.labels.login' | translateFallback: 'Login' }}
      </label>
      <app-form-field>
        <input type="text" class="mt-1 input" [formControlName]="login" />
      </app-form-field>
    </div>
    <div class="d-flex flex-column mt-4">
      @let password = 'password';
      <label [for]="password">
        {{ 'LOGIN_COMPONENT.form.labels.password' | translateFallback: 'Hasło' }}
      </label>
      <app-form-field>
        <input type="text" class="mt-1 input" [formControlName]="password" />
      </app-form-field>
    </div>
    <app-button
      [buttonType]="'submit'"
      [buttonConfiguration]="loginButtonConfig"
      [buttonDisabled]="!formGroup()?.valid"
    >
      {{ 'BUTTONS.login' | translateFallback: 'Zaloguj się' }}
    </app-button>
  </form>
</div>
