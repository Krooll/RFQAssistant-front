<div class="d-flex flex-column component-container">
  <div class="d-flex align-items-center justify-content-between p-1">
    <h2>{{ 'PROCESS_COMPONENT.componentTitle' | translateFallback: 'Procesy' }}</h2>
    <app-button [buttonType]="ButtonTypes.button" (emitButtonClick)="onAddButtonClicked()">
      {{ 'BUTTONS.add' | translateFallback: 'Dodaj' }}
    </app-button>
  </div>
  <div class="list-container">
    <app-table
      (deleteClick)="onDeleteButtonCLicked($event)"
      (infoClick)="onInfoButtonClicked($event)"
      (pageChange)="_processComponentService.updatePageParams($event)"
      [dataSource]="_processComponentService.processList()"
      [pageParams]="_processComponentService.pageParams()"
      [totalElements]="_processComponentService.totalElements()"
    ></app-table>
  </div>
</div>
